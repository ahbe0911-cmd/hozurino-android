<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>حضورینو</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:#172033;font-family:Tahoma,Arial,sans-serif}.app{max-width:520px;margin:auto;padding:12px}.bismillah{text-align:center;color:#1e3a8a;font-size:17px;font-weight:700;margin:5px}.date{text-align:center;color:#64748b;font-size:13px;margin-bottom:10px}.panel{background:#fff;border-radius:18px;padding:14px;box-shadow:0 5px 24px #0f172a14}.brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:14px}.logo{width:42px;height:42px;border-radius:13px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:bold}.brand h1{font-size:21px;margin:0}.brand small{display:block;color:#64748b;text-align:center}.btn{border:0;border-radius:11px;padding:12px 10px;color:#fff;font-weight:700;font-size:14px;width:100%;font-family:inherit}.blue{background:#2563eb}.yellow{background:#ca8a04}.purple{background:#7c3aed}.green{background:#16a34a}.red{background:#dc2626}.gray{background:#64748b}.row{display:flex;gap:8px}.row>*{flex:1}.toolbar{display:grid;gap:8px;margin-bottom:13px}.field{margin-bottom:10px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:5px;color:#475569}.input{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:14px inherit;outline:none;background:#fff}.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb20}.search{display:flex}.search .input{border-radius:0 10px 10px 0}.search .btn{width:90px;border-radius:10px 0 0 10px}.employee{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:12px;margin:12px 0;display:none}.employee.show{display:block}.details{display:grid;grid-template-columns:90px 1fr;gap:8px;font-size:13px;margin-bottom:12px}.details b{color:#475569}.status{display:flex;align-items:center;gap:7px;background:#ecfdf5;color:#047857;padding:8px 10px;border-radius:10px;font-size:12px;margin-bottom:10px}.dot{width:8px;height:8px;border-radius:50%;background:#10b981}.tableWrap{overflow:auto;border:1px solid #e2e8f0;border-radius:12px;margin-top:13px}table{border-collapse:collapse;width:100%;min-width:510px;font-size:11px}th{background:#f1f5f9;color:#475569}th,td{padding:9px 6px;border-bottom:1px solid #e2e8f0;text-align:center}tr:last-child td{border:0}.empty{padding:25px;color:#94a3b8;text-align:center}.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:20;padding:18px;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:#fff;border-radius:18px;padding:17px;width:100%;max-width:450px;max-height:90vh;overflow:auto}.box h2{font-size:18px;margin:0 0 14px}.toast{position:fixed;top:15px;right:15px;left:15px;z-index:50;color:#fff;border-radius:11px;padding:12px;text-align:center;font-size:13px;animation:fade 3s forwards}.ok{background:#16a34a}.error{background:#dc2626}.warn{background:#ca8a04}@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}.hint{text-align:center;color:#64748b;font-size:11px;margin-top:10px}.monthTotal{background:#f5f3ff;color:#6d28d9;border-radius:10px;padding:10px;margin:10px 0;font-size:13px;font-weight:bold}
</style></head><body><div class="app"><div class="bismillah">بسم الله الرحمن الرحیم</div><div class="date" id="date"></div>
<main class="panel"><div class="brand"><div class="logo">✓</div><div><h1>حضورینو</h1><small>سیستم حضور و غیاب آفلاین</small></div></div>
<div class="toolbar"><button class="btn blue" onclick="openModal('employeeModal')">＋ افزودن کارمند</button><div class="row"><button class="btn yellow" onclick="exportAll()">خروجی فایل</button><button class="btn purple" onclick="showMonthly()">گزارش ماهانه</button></div></div>
<div class="field"><label>کد ملی یا کد پرسنلی:</label><div class="search"><input id="searchId" class="input" inputmode="numeric" placeholder="کد را وارد کنید"><button class="btn blue" onclick="searchEmployee()">جستجو</button></div></div>
<section id="employeeCard" class="employee"><div class="status"><span class="dot"></span>آماده ثبت با اثر انگشت همین گوشی</div><div class="details"><b>نام:</b><span id="eName"></span><b>کد:</b><span id="eId"></span><b>سمت:</b><span id="ePos"></span></div><div class="row"><button class="btn green" onclick="startAuth('ورود')">ثبت ورود</button><button class="btn red" onclick="startAuth('خروج')">ثبت خروج</button></div></section>
<div class="tableWrap"><table><thead><tr><th>ردیف</th><th>نام</th><th>کد</th><th>تاریخ</th><th>ورود</th><th>خروج</th></tr></thead><tbody id="records"></tbody></table></div><div class="hint">اطلاعات و اثر انگشت از گوشی خارج نمی‌شود</div></main></div>

<div id="employeeModal" class="modal"><div class="box"><h2>افزودن کارمند</h2><div class="field"><label>نام و نام خانوادگی</label><input id="newName" class="input"></div><div class="field"><label>کد ملی یا پرسنلی</label><input id="newId" class="input" inputmode="numeric"></div><div class="field"><label>سمت</label><input id="newPos" class="input"></div><div class="row"><button class="btn gray" onclick="closeModal('employeeModal')">انصراف</button><button class="btn blue" onclick="saveEmployee()">ذخیره</button></div></div></div>
<div id="monthlyModal" class="modal"><div class="box"><h2>گزارش ماهانه</h2><div class="field"><label>ماه</label><select id="month" class="input" onchange="renderMonthly()"><option>فروردین</option><option>اردیبهشت</option><option>خرداد</option><option>تیر</option><option>مرداد</option><option>شهریور</option><option>مهر</option><option>آبان</option><option>آذر</option><option>دی</option><option>بهمن</option><option>اسفند</option></select></div><div id="monthTotal" class="monthTotal"></div><div class="tableWrap"><table><thead><tr><th>نام</th><th>تاریخ</th><th>ورود</th><th>خروج</th><th>مدت</th></tr></thead><tbody id="monthlyRows"></tbody></table></div><div class="row" style="margin-top:12px"><button class="btn gray" onclick="closeModal('monthlyModal')">بستن</button><button class="btn yellow" onclick="exportMonth()">خروجی ماه</button></div></div></div>
<script>
let employees=JSON.parse(localStorage.getItem('employees')||'[]'),records=JSON.parse(localStorage.getItem('records')||'[]'),selected=null,pending=null;
const months=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function fa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function jalali(g){let gy=g.getFullYear(),gm=g.getMonth()+1,gd=g.getDate(),gdm=[0,31,59,90,120,151,181,212,243,273,304,334],jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;let gy2=gm>2?gy+1:gy,days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return{jy,jm,jd}}
function dateText(ms){let d=new Date(ms),j=jalali(d);return fa(j.jy+'/'+String(j.jm).padStart(2,'0')+'/'+String(j.jd).padStart(2,'0'))}
function timeText(ms){return new Date(ms).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}
function updateClock(){let d=new Date(),j=jalali(d);document.getElementById('date').textContent=fa(j.jd)+' '+months[j.jm-1]+' '+fa(j.jy)+' — '+d.toLocaleTimeString('fa-IR')}
setInterval(updateClock,1000);updateClock();
function persist(){localStorage.setItem('employees',JSON.stringify(employees));localStorage.setItem('records',JSON.stringify(records))}
function toast(msg,type='ok'){let x=document.createElement('div');x.className='toast '+type;x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),3100)}
function openModal(id){document.getElementById(id).classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}
function saveEmployee(){let name=newName.value.trim(),id=newId.value.trim(),pos=newPos.value.trim();if(!name||id.length<3||!pos)return toast('اطلاعات کارمند را کامل کنید','error');if(employees.some(e=>e.id===id))return toast('این کد قبلاً ثبت شده','warn');employees.push({id,name,pos});persist();newName.value=newId.value=newPos.value='';closeModal('employeeModal');searchId.value=id;searchEmployee();toast('کارمند ذخیره شد')}
function searchEmployee(){let id=searchId.value.trim();selected=employees.find(e=>e.id===id);employeeCard.classList.toggle('show',!!selected);if(!selected)return toast('کارمندی با این کد پیدا نشد','error');eName.textContent=selected.name;eId.textContent=selected.id;ePos.textContent=selected.pos}
function startAuth(type){if(!selected)return toast('ابتدا کارمند را جستجو کنید','error');pending=type;if(window.Android)Android.authenticate(type);else onBiometricResult(type,true,'حالت آزمایشی')}
window.onBiometricResult=function(type,ok,msg){if(!ok)return toast(msg,'error');let today=dateText(Date.now()),r=records.find(x=>x.id===selected.id&&dateText(x.day)===today);if(type==='ورود'){if(r&&r.in)return toast('ورود امروز قبلاً ثبت شده','warn');if(!r){r={id:selected.id,name:selected.name,pos:selected.pos,day:Date.now(),in:null,out:null};records.push(r)}r.in=Date.now()}else{if(!r||!r.in)return toast('ابتدا ورود را ثبت کنید','error');if(r.out)return toast('خروج امروز قبلاً ثبت شده','warn');r.out=Date.now()}persist();render();toast(type+' با اثر انگشت ثبت شد')}
function render(){records.sort((a,b)=>b.day-a.day);recordsEl=document.getElementById('records');recordsEl.innerHTML=records.length?'':'<tr><td colspan="6" class="empty">هنوز ترددی ثبت نشده</td></tr>';records.forEach((r,i)=>recordsEl.innerHTML+=`<tr><td>${fa(i+1)}</td><td>${r.name}</td><td>${fa(r.id)}</td><td>${dateText(r.day)}</td><td>${r.in?timeText(r.in):'—'}</td><td>${r.out?timeText(r.out):'—'}</td></tr>`)}
function duration(r){if(!r.in||!r.out)return'—';let m=Math.floor((r.out-r.in)/60000);return fa(Math.floor(m/60)+' ساعت و '+m%60+' دقیقه')}
function showMonthly(){let j=jalali(new Date());month.selectedIndex=j.jm-1;openModal('monthlyModal');renderMonthly()}
function monthData(){return records.filter(r=>jalali(new Date(r.day)).jm===month.selectedIndex+1)}
function renderMonthly(){let data=monthData(),mins=0;monthlyRows.innerHTML=data.length?'':'<tr><td colspan="5" class="empty">رکوردی یافت نشد</td></tr>';data.forEach(r=>{if(r.in&&r.out)mins+=Math.floor((r.out-r.in)/60000);monthlyRows.innerHTML+=`<tr><td>${r.name}</td><td>${dateText(r.day)}</td><td>${r.in?timeText(r.in):'—'}</td><td>${r.out?timeText(r.out):'—'}</td><td>${duration(r)}</td></tr>`});monthTotal.textContent='جمع حضور: '+fa(Math.floor(mins/60)+' ساعت و '+mins%60+' دقیقه')}
function csv(data){let rows=[['نام','کد','سمت','تاریخ','ورود','خروج','مدت']];data.forEach(r=>rows.push([r.name,r.id,r.pos,dateText(r.day),r.in?timeText(r.in):'',r.out?timeText(r.out):'',duration(r)]));return rows.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')}
function save(data,name){if(!data.length)return toast('رکوردی برای خروجی وجود ندارد','warn');Android.saveCsv(csv(data),name)}
function exportAll(){save(records,'hozurino-all.csv')}function exportMonth(){save(monthData(),'hozurino-'+months[month.selectedIndex]+'.csv')}
render();
</script></body></html>
