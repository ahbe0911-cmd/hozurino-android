name: Build Hozourino 2.7.0 Source

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite-v2.7.0-src

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Rebuild source archive
        run: |
          cat payload/minpart00.txt payload/minpart01.txt payload/minpart02.txt payload/minpart03.txt \
              payload/rest00.txt payload/rest01.txt payload/rest02.txt payload/rest03.txt \
              payload/rest04.txt payload/rest05.txt payload/rest06.txt payload/rest07.txt \
            | base64 -d > minimal.tar.xz
          echo "c5952f2fec6ba9afbbbc063891d5d79b320ca5f322882b8c72b2f38817f90b1c  minimal.tar.xz" | sha256sum -c -
          rm -rf project
          mkdir project
          tar -xJf minimal.tar.xz -C project

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hozourino-2.7.0-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
