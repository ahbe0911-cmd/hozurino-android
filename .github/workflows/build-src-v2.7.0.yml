name: Build Hozourino 2.7.2 Report Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix-v2.7.2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Rebuild verified 2.7.0 source
        run: |
          cat payload/minpart00.txt payload/minpart01.txt payload/minpart02.txt payload/minpart03.txt \
              payload/rest00.txt payload/rest01.txt payload/rest02.txt payload/rest03.txt \
              payload/rest04.txt payload/rest05.txt payload/rest06.txt payload/rest07.txt \
            | base64 -d > minimal.tar.xz
          echo "c5952f2fec6ba9afbbbc063891d5d79b320ca5f322882b8c72b2f38817f90b1c  minimal.tar.xz" | sha256sum -c -
          rm -rf project
          mkdir project
          tar -xJf minimal.tar.xz -C project

      - name: Apply verified 2.7.2 patch
        run: |
          cat fix272/part00.txt fix272/part01.txt fix272/part02.txt \
              fix272/part03.txt fix272/part04.txt fix272/part05.txt \
            | base64 -d > code_patch.tar.xz
          echo "daf9801408b186b1dea8ec72a889b91e2e463ab927dd41e7c2d2e2ee479acd7a  code_patch.tar.xz" | sha256sum -c -
          rm -rf /tmp/hozpatch
          mkdir -p /tmp/hozpatch
          tar -xJf code_patch.tar.xz -C /tmp/hozpatch

          cp /tmp/hozpatch/TimeUtils.kt project/app/src/main/java/com/hozourino/fingerprint/core/util/TimeUtils.kt
          cp /tmp/hozpatch/TimeInput.kt project/app/src/main/java/com/hozourino/fingerprint/core/util/TimeInput.kt
          cp /tmp/hozpatch/JalaliDateUtils.kt project/app/src/main/java/com/hozourino/fingerprint/core/util/JalaliDateUtils.kt
          cp /tmp/hozpatch/HashUtils.kt project/app/src/main/java/com/hozourino/fingerprint/core/security/HashUtils.kt
          cp /tmp/hozpatch/ManualAttendanceSaver.kt project/app/src/main/java/com/hozourino/fingerprint/domain/service/ManualAttendanceSaver.kt
          cp /tmp/hozpatch/HTimePickerDialog.kt project/app/src/main/java/com/hozourino/fingerprint/presentation/components/HTimePickerDialog.kt
          cp /tmp/hozpatch/ShiftEditViewModel.kt project/app/src/main/java/com/hozourino/fingerprint/presentation/shifts/ShiftEditViewModel.kt
          cp /tmp/hozpatch/Type.kt project/app/src/main/java/com/hozourino/fingerprint/presentation/theme/Type.kt
          cp /tmp/hozpatch/PdfReportGenerator.kt project/app/src/main/java/com/hozourino/fingerprint/core/pdf/PdfReportGenerator.kt
          cp /tmp/hozpatch/PdfPreviewViewModel.kt project/app/src/main/java/com/hozourino/fingerprint/presentation/pdf/PdfPreviewViewModel.kt
          cp /tmp/hozpatch/ReportTransferStore.kt project/app/src/main/java/com/hozourino/fingerprint/presentation/reports/ReportTransferStore.kt
          cp /tmp/hozpatch/ReportsViewModel.kt project/app/src/main/java/com/hozourino/fingerprint/presentation/reports/ReportsViewModel.kt
          cp /tmp/hozpatch/ReportPrintPolicy.kt project/app/src/main/java/com/hozourino/fingerprint/presentation/reports/ReportPrintPolicy.kt

          mkdir -p project/app/src/test/java/com/hozourino/fingerprint/core/util
          mkdir -p project/app/src/test/java/com/hozourino/fingerprint/presentation/reports
          cp /tmp/hozpatch/TimeInputTest.kt project/app/src/test/java/com/hozourino/fingerprint/core/util/TimeInputTest.kt
          cp /tmp/hozpatch/TimeUtilsTest.kt project/app/src/test/java/com/hozourino/fingerprint/core/util/TimeUtilsTest.kt
          cp /tmp/hozpatch/JalaliDateUtilsTest.kt project/app/src/test/java/com/hozourino/fingerprint/core/util/JalaliDateUtilsTest.kt
          cp /tmp/hozpatch/ReportPrintPolicyTest.kt project/app/src/test/java/com/hozourino/fingerprint/presentation/reports/ReportPrintPolicyTest.kt
          cp /tmp/hozpatch/app_build.gradle.kts project/app/build.gradle.kts

      - name: Install Vazir and Nazanin fonts
        run: |
          mkdir -p project/app/src/main/res/font
          rm -f project/app/src/main/res/font/far_titr_bold.ttf
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Regular.ttf \
            -o project/app/src/main/res/font/vazirmatn_regular.ttf
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Bold.ttf \
            -o project/app/src/main/res/font/vazirmatn_bold.ttf
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/mohammadhasananisi/personal_accountant/26f09ce3e414f5d6293f47296ab0dfd9af283d7e/assets/fonts/Far_Nazanin.ttf \
            -o project/app/src/main/res/font/far_nazanin.ttf
          test -s project/app/src/main/res/font/vazirmatn_regular.ttf
          test -s project/app/src/main/res/font/vazirmatn_bold.ttf
          test -s project/app/src/main/res/font/far_nazanin.ttf
          test ! -e project/app/src/main/res/font/far_titr_bold.ttf

      - name: Run unit tests
        working-directory: project
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare unsigned release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          old = '''            signingConfig = if (hasReleaseKeystore) {
                signingConfigs.getByName("release")
            } else {
                // در نبود کی‌استور، با کلید دیباگ امضا می‌شود تا بیلد متوقف نشود
                signingConfigs.getByName("debug")
            }'''
          if old not in s:
              raise SystemExit('release signing block not found')
          p.write_text(s.replace(old, '            signingConfig = null'), encoding='utf-8')
          PY

      - name: Build unsigned release APK
        working-directory: project
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect Android signing tools
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/34.0.0/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/34.0.0/zipalign" signing-tools/zipalign

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hozourino-2.7.2-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Hozourino-2.7.2-release-unsigned
          path: project/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-signing-34
          path: signing-tools
          if-no-files-found: error
          retention-days: 1
