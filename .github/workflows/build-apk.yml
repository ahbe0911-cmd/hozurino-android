name: Build Hozorino APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # دریافت سورس
      - name: Checkout source
        uses: actions/checkout@v4


      # نصب Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # کش Gradle برای سرعت بیشتر
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4


      # نصب Node برای پروژه‌های Capacitor/React
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # نصب پکیج‌ها در صورت وجود package.json
      - name: Install npm dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi


      # ساخت نسخه وب در صورت وجود
      - name: Build Web
        run: |
          if [ -f package.json ]; then
            npm run build || true
          fi


      # Sync کردن Capacitor در صورت وجود
      - name: Capacitor Sync
        run: |
          if [ -d android ]; then
            npx cap sync android || true
          fi


      # ساخت APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug


      # ذخیره APK خروجی
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hozorino-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
