name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle offline MobileFaceNet model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/Eartherai/FaceAuthApp/29e9fc3efc6435996ee992428260e7d490428429/FaceAuthApp/android/app/src/main/assets/mobilefacenet_fp32.onnx \
            -o app/src/main/assets/mobilefacenet_fp32.onnx
          test "$(stat -c%s app/src/main/assets/mobilefacenet_fp32.onnx)" -eq 3997466

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: حضورینو ۳ — نسخه مخصوص Galaxy A54
          body: تشخیص چهره واقعی آفلاین با MobileFaceNet، ثبت چندکاربره، PIN، پنل مدیریت و گزارش تردد.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
