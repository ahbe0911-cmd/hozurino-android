name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: حضورینو ۴ — کد پرسنلی و اثر انگشت
          body: نسخه کاملاً آفلاین برای گوشی شخصی کارکنان؛ فعال‌سازی با کد پرسنلی، ثبت ورود و خروج با اثر انگشت امن گوشی و تاریخچه محلی.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
