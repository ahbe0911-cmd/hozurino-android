name: Build Hozourino Rewrite 2.7.0

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite-v2.7.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract rewritten project
        run: |
          rm -rf project
          mkdir project
          unzip -q hozourino-v2.7.0-rewrite.zip -d project

      - name: Make release output unsigned
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          old = '''signingConfig = if (hasReleaseKeystore) {
                signingConfigs.getByName("release")
            } else {
                // در نبود کی‌استور، با کلید دیباگ امضا می‌شود تا بیلد متوقف نشود
                signingConfigs.getByName("debug")
            }'''
          new = '''signingConfig = if (hasReleaseKeystore) {
                signingConfigs.getByName("release")
            } else {
                null
            }'''
          if old not in s:
              raise SystemExit('Expected signing block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Build debug and unsigned release APKs
        working-directory: project
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hozourino-2.7.0-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload unsigned release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hozourino-2.7.0-release-unsigned
          path: project/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
