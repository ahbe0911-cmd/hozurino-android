name: Build Hozurino Parallel APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-parallel-apk.yml'
permissions:
  contents: read
jobs:
  build-parallel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure independent installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('applicationId = "ir.hozurino.app"', 'applicationId = "ir.hozurino.app.parallel"')
          s=s.replace('versionCode = 7', 'versionCode = 8')
          s=s.replace('versionName = "6.0.0-html-pattern"', 'versionName = "6.0.1-parallel"')
          p.write_text(s)
          PY
      - name: Build APK with fresh debug signing key
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hozurino-6.0.1-parallel-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
